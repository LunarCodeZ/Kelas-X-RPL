<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position</title>

    <style>
        .container {
            position: absolute;
            top: 100px;
            background-color: aqua;
        }
        /* Mengambil jarak dari body */

        .box-1 {
            background-color: red;
        }

        .box-2 {
            background-color: yellow;
        }

        .box-3 {
            background-color: lime;
            position: relative;
            top: -100px;
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="box-1">
            <h1>Box 1</h1>
        </div>
        
        <div class="box-2">
            <h1>Box 2</h1>
        </div>

        <div class="box-3">
            <h1>Box 3 Box 3 Box 3 Box 3 Box 3</h1>
        </div>
        <!-- Box 1,2 dan 3 didalam div container -->

    </div>
</body>
</html>
