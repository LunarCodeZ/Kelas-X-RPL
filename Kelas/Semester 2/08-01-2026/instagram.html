<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
</head>
<body>
    <section style="background-color: aqua; display: flex; justify-content: center;
    padding: 2%; gap: 2%;">
        <!-- Box Kiri -->
        <div style="width: 40%; text-align: center;
        padding: 10px 20px;">
            <h1>Instagram</h1>
            <p>
                Lihat momen sehari-hari dari teman
                dekat anda
            </p>
            <img src="img/images.jpg" alt="">
        </div>

        <!-- Box Kanan -->
        <div style="width: 40%; text-align: center;
        padding: 10px 20px; border: 1px solid black;">
            <h2>Login ke Instagram</h2>
            <form action="">
                <input type="text" placeholder="Nomor ponsel, nama pengguna atau email"
                style="width: 300px; margin-bottom: 5px;"><br />
                <input type="password" placeholder="Kata Sandi" style="width: 300px;"><br /><br />
                <input type="submit" value="Masuk"><br />
                <input type="button" value="Lupa kata sandi?"><br />
            </form>

            <br />
            <button>Login dengan Facebook</button><br />
            <button>Buat akun baru</button>
        </div>
    </section>

    <footer>
        &copy; Instagram - by Erik
    </footer>
</body>
</html>
