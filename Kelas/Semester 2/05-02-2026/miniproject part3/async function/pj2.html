<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async Function 2</title>
</head>
<body>
    <button onclick="load()">Load</button>
    <p id="hasil"></p>

    <script>
        async function load() {
            document.getElementById("hasil").innerHTML = 'Loading...';
            await new Promise(r => setTimeout(r, 2000));
            document.getElementById("hasil").innerHTML = 'Data Tampil';
        }
    </script>
</body>
</html>
