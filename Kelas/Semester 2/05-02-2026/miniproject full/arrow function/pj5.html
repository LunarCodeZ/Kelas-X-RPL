<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Hello</title>
</head>
<body>
    <button onclick="HELLO()">Hello</button>
    <p id="hasil"></p>
    <script>
        const HELLO = () => document.getElementById("hasil").innerHTML = 'Hello World';
    </script>
</body>
</html>
