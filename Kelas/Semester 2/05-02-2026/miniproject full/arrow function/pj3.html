<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Penjumlahan</title>
</head>
<body>
    <input type="number" id="a">
    <input type="number" id="b">
    <button onclick="JUMLAH()">Jumlahkan</button>
    <p id="hasil"></p>

    <script>
        const JUMLAH = () => document.getElementById("hasil").innerHTML = Number(document.getElementById("a").value) + Number(document.getElementById("b").value);
    </script>
</body>
</html>
