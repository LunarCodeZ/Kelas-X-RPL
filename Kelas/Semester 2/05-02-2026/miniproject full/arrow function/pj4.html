<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Cek Usia</title>
</head>
<body>
    <input type="number" id="usia">
    <button onclick="CEK()">Cek</button>
    <p id="hasil"></p>

    <script>
        const CEK = () => document.getElementById("hasil").innerHTML = document.getElementById("usia").value >= 17 ? 'Dewasa' : 'Anak';
    </script>
</body>
</html>
