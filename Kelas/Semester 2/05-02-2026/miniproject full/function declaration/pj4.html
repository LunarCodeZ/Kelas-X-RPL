<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hitung Umur</title>
</head>
<body>
    <input type="number" id="tahun">
    <button onclick="umur()">Hitung Umur</button>
    <p id="hasil"></p>
    <script>
        function umur() {
            document.getElementById("hasil").innerHTML = 2026-document.getElementById("tahun").value;
        }
    </script>
</body>
</html>
