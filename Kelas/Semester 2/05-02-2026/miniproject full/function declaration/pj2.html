<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Nilai</title>
</head>
<body>
    <input type="number" id="nilai">
    <button onclick="cek()">Cek</button>
    <p id="hasil"></p>

    <script>
        function cek() {
            document.getElementById("hasil").innerHTML = document.getElementById("nilai").value >= 75 ? 'Lulus' : 'Tidak Lulus';
        }
    </script>
</body>
</html>
