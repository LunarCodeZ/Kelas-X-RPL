<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Diskon</title>
</head>
<body>
    <input type="number" id="harga">
    <button onclick="diskon()">Diskon</button>
    <p id="hasil"></p>
    
    <script>
        function diskon() {
            document.getElementById("hasil").innerHTML = document.getElementById("harga").value * 0.1;
        }
    </script>
</body>
</html>
