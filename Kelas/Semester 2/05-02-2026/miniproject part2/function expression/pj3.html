<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konversi Mata Uang</title>
</head>
<body>
    <input type="number" id="rupiah">
    <button onclick="KONVERSI()">Konversi ke Dolar</button>
    <p id="hasil"></p>

    <script>
        const KONVERSI = function () {
            document.getElementById("hasil").innerHTML = document.getElementById("rupiah").value / 15000;
        }
    </script>
</body>
</html>
