<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sapa Nama</title>
</head>
<body>
    <input type="text" id="nama">
    <button onclick="SAPA()">Sapa</button>
    <p id="hasil"></p>

    <script>
        const SAPA = function() {
            document.getElementById("hasil").innerHTML = document.getElementById("nama").value;
        }
    </script>
</body>
</html>
