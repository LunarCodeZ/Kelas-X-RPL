<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Callback Function 1</title>
</head>
<body>
    <input type="number" id="a">
    <input type="number" id="b">
    <button onclick="hitung()">Tambah</button>

    <script>
        function proses(x, y, cb) {
            cb(x, y);
        }
        function hitung() {
            proses(Number(document.getElementById("a").value), Number(document.getElementById("b").value), function(x, y) {
                document.getElementById("hasil").innerHTML = x+y;
            })
        }
    </script>
</body>
</html>
