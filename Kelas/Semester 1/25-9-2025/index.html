<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Belajar CSS</title>

    <link rel="stylesheet" href="style.css" />
    <style>
        nav {
            background-color: red;
            /* position: absolute;
            top: 300px; */
        }

        .lebar {
            width: 100px;
        }

        /* .panjang {} */

        .tinggi {
            height: 150px;
        }

        .box-1 {
            background-color: yellow;
            position: absolute;
            top: 100px;
        }

        .box-2 {
            background-color: green;
            position: absolute;
            top: 100px;
            right: 100px;
        }

        .box-3 {
            background-color: aqua;
            position: absolute;
            top: 100px;
            right: 250px;
        }

        .batas-atas {
            margin-top: 30px;
        }

        .batas-bawah {
            margin-bottom: 30px;
        }

        .batas-kiri {
            margin-left: 30px;
        }

        .batas-kanan {
            margin-right: 30px;
        }

        .batas-dalam-atas {
            padding-top: 30px;
        }

        .batas-dalam-bawah {
            padding-bottom: 30px;
        }

        .batas-dalam-kiri {
            padding-left: 30px;
        }

        .batas-dalam-kanan {
            padding-right: 30px;
        }
    </style>
</head>

<body>
    <div id="rumah" style="width: 80%; margin: auto">
        <div class="jarak" style="background-color: aqua">
            <a href="pages/profile.html">Identitas</a>
        </div>
        <div class="pendidikan huruf" style="background-color: rgb(255, 80, 80)">
            Riwayat Pendidikan
        </div>
        <div style="background-color: rgb(0, 255, 8)" class="huruf kompetensi jarak">
            Kompetensi
        </div>
    </div>

    <nav>
        <nav class="batas-dalam-atas batas-dalam-kiri batas-dalam-bawah batas-dalam-kanan">
            <div class="box-1 lebar tinggi batas-bawah batas-dalam-atas batas-dalam-bawah batas-dalam-kiri">
                box-1
            </div>
            <div class="box-2 lebar tinggi batas-bawah batas-dalam-atas batas-dalam-kiri batas-dalam-bawah">
                box-2
            </div>
            <div class="box-3 lebar tinggi batas-dalam-atas batas-dalam-bawah batas-dalam-kiri">
                box-3
            </div>
        </nav>
    </nav>
</body>

</html>
